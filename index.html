<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>문도 피구</title>
  <link rel="preload" href="assets/fonts/Jua-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>

  <!-- 양쪽 초상화 · 체력 -->
  <div id="topbar" class="hidden" aria-label="대전 현황">
    <div class="fighter blue" id="fighter-0">
      <div class="fight-portrait"><img src="assets/cartoon/portrait-hud-v3.png" alt="내 문도 초상화" /></div>
      <div class="fighter-info">
        <div class="fighter-name"><span>문도 박사</span><small>PLAYER 1</small></div>
        <div class="health-track" id="health-0" role="progressbar" aria-label="내 문도 체력" aria-valuemin="0" aria-valuemax="640"><div class="health-fill"></div><span class="health-value" id="hp-0">640 / 640</span></div>
      </div>
    </div>
    <div class="fighter red" id="fighter-1">
      <div class="fight-portrait"><img src="assets/cartoon/portrait-hud-v3.png" alt="상대 문도 초상화" /></div>
      <div class="fighter-info">
        <div class="fighter-name"><span>문도 박사</span><small>CPU</small></div>
        <div class="health-track" id="health-1" role="progressbar" aria-label="상대 문도 체력" aria-valuemin="0" aria-valuemax="640"><div class="health-fill"></div><span class="health-value" id="hp-1">640 / 640</span></div>
      </div>
    </div>
  </div>

  <div id="chat"></div>

  <!-- 하단 HUD -->
  <div id="hud" class="hidden">
    <div class="skills" aria-label="스킬 및 소환사 주문">
      <div class="spell">
        <div class="skill" id="sk-q" role="img" aria-label="Q 식칼 투척"><div class="icon q-icon"></div><div class="cd"></div><span class="cdtext"></span><span class="key">Q</span></div>
        <span class="spell-name">식칼 투척</span>
      </div>
      <div class="spell">
        <div class="skill" id="sk-d" role="img" aria-label="D 점멸"><div class="icon d-icon"></div><div class="cd"></div><span class="cdtext"></span><span class="key">D</span></div>
        <span class="spell-name">점멸</span>
      </div>
      <div class="spell">
        <div class="skill" id="sk-f" role="img" aria-label="F 유체화"><div class="icon f-icon"></div><div class="cd"></div><span class="cdtext"></span><span class="key">F</span></div>
        <span class="spell-name">유체화</span>
      </div>
    </div>
  </div>

  <div id="loading" class="screen" aria-labelledby="loading-title">
    <div class="loading-content">
      <div class="loading-art" aria-hidden="true">
        <img src="assets/cartoon/portrait-hud-v3.png" alt="" width="256" height="256" fetchpriority="high" />
      </div>
      <h1 id="loading-title">문도 <span>피구</span></h1>
      <p class="loading-tagline"><strong><em>문도</em></strong>, 가고 <strong><em>싶은 대로</em></strong> 간다! (츄릅)</p>
      <div class="loading-progress">
        <div class="loading-status"><span id="load-text" role="status">문도 깨우는 중…</span><span id="load-percent" aria-hidden="true">0%</span></div>
        <div class="loadbar" id="load-progress" role="progressbar" aria-label="게임 로딩" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="load-fill"></div></div>
      </div>
      <p class="loading-tip"><kbd>Q</kbd> 식칼을 던지고, <kbd>D</kbd> 점멸로 피하세요.</p>
    </div>
  </div>

  <div id="menu" class="screen hidden">
    <main class="match-setup" aria-labelledby="select-title">
      <header class="setup-heading">
        <p class="setup-brand">문도 <span>피구</span></p>
        <h1 id="select-title">봇 난이도 선택</h1>
        <p class="setup-subtitle" id="difficulty-label">상대 봇의 난이도를 골라주세요.</p>
      </header>
      <div id="opt-diff" role="group" aria-labelledby="difficulty-label">
        <button type="button" data-v="easy" aria-pressed="false">
          <span class="difficulty-top"><span class="difficulty-level">LEVEL 01</span><span class="difficulty-check" aria-hidden="true"></span></span>
          <span class="difficulty-meter" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="difficulty-name">쉬움</span>
          <span class="difficulty-description">천천히, 감 잡기</span>
        </button>
        <button type="button" data-v="normal" class="on" aria-pressed="true">
          <span class="difficulty-top"><span class="difficulty-level">LEVEL 02</span><span class="difficulty-check" aria-hidden="true"></span></span>
          <span class="difficulty-meter" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="difficulty-name">보통</span>
          <span class="difficulty-description">제대로 한 판</span>
        </button>
        <button type="button" data-v="hard" aria-pressed="false">
          <span class="difficulty-top"><span class="difficulty-level">LEVEL 03</span><span class="difficulty-check" aria-hidden="true"></span></span>
          <span class="difficulty-meter" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="difficulty-name">어려움</span>
          <span class="difficulty-description">빈틈없이, 전력 승부</span>
        </button>
        <button type="button" data-v="faker" aria-pressed="false">
          <span class="difficulty-top"><span class="difficulty-level">LEVEL ∞</span><span class="difficulty-check" aria-hidden="true"></span></span>
          <span class="difficulty-meter" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="difficulty-name">페이커</span>
          <span class="difficulty-description">다 읽힌다, 그래도 이겨봐</span>
        </button>
      </div>
      <button id="start-btn" type="button">게임 시작</button>
    </main>
  </div>

  <div id="result" class="screen hidden">
    <div class="panel">
      <h1 id="result-title">승리</h1>
      <p id="result-sub"></p>
      <table id="result-table"></table>
      <div class="btns">
        <button id="again-btn" class="lol-btn">다시 하기</button>
        <button id="menu-btn" class="lol-btn ghost">메뉴로</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>

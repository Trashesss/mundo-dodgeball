<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>문도 피구 · 공유 이미지 원본</title>
  <style>
    @font-face { font-family: Jua; src: url('../assets/fonts/Jua-Regular.ttf'); }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #11262e; color: #f5f0dc; font-family: Jua, sans-serif; }
    .portrait { position: absolute; right: -28px; top: -34px; width: 700px; height: 700px; object-fit: cover; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #11262e 0%, #11262e 37%, #11262ed9 44%, #11262e00 65%); }
    main { position: absolute; inset: 64px auto 56px 64px; width: 560px; }
    .brand { margin: 0 0 58px; font-size: 32px; color: #c5a4ed; letter-spacing: 2px; }
    h1 { margin: 0; font-weight: 400; font-size: 76px; line-height: 1.2; letter-spacing: -3px; text-shadow: 0 6px #07171f; }
    h1 span { color: #bde59f; }
    .description { margin: 28px 0 0; max-width: 490px; font-size: 30px; line-height: 1.4; color: #efe5ff; word-break: keep-all; }
    .tag { display: inline-block; margin-top: 38px; padding: 13px 20px 11px; border-radius: 12px; background: #c5a4ed18; color: #d7bff5; font-size: 23px; }
  </style>
</head>
<body>
  <img class="portrait" src="../assets/cartoon/portrait-hud-v3.png" alt="식칼을 든 문도" />
  <div class="shade"></div>
  <main>
    <p class="brand">문도 피구</p>
    <h1>문도 피구<br /><span>도전!</span></h1>
    <p class="description">날아오는 식칼을 피하고, 상대 문도를 쓰러뜨리는 피구 게임</p>
    <div class="tag">피하고 · 던지고 · 살아남아라</div>
  </main>
  <script type="module">
    import { DIFFICULTY_NAMES, shareContent } from '../src/share.js';
    const params = new URLSearchParams(location.search);
    const difficulty = params.get('difficulty');
    if (Object.hasOwn(DIFFICULTY_NAMES, difficulty)) {
      const win = params.get('result') === 'win';
      const content = shareContent(difficulty, win);
      const heading = document.querySelector('h1');
      heading.replaceChildren(document.createTextNode(`${DIFFICULTY_NAMES[difficulty]} 난이도`), document.createElement('br'));
      const outcome = document.createElement('span');
      outcome.textContent = win ? '클리어!' : '실패';
      heading.append(outcome);
      document.querySelector('.description').textContent = content.description;
    }
    window.previewReady = true;
  </script>
</body>
</html>
